<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messages de contact — Administration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/admin.css">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body data-admin-guard="true">

<div class="admin-layout">
  <div data-include="sidebar-admin"></div>

  <main class="admin-main">
    <h1 style="font-size:30px">Messages de contact</h1>

    <table class="admin-table">
      <thead><tr><th></th><th>Nom</th><th>Sujet</th><th>Date</th><th></th></tr></thead>
      <tbody id="table-messages">
        <tr><td colspan="5" class="empty-state">Chargement…</td></tr>
      </tbody>
    </table>
  </main>
</div>

<template id="tpl-message-detail">
  <tr class="detail-row">
    <td colspan="5">
      <div class="admin-card outline">
        <p style="margin:0 0 8px"><strong data-slot="email"></strong> <span data-slot="telephone" style="color:var(--color-text-muted)"></span></p>
        <p data-slot="message" style="white-space:pre-wrap"></p>
        <div style="display:flex;gap:12px;margin-top:12px">
          <a class="btn btn-outline" data-slot="mailto" href="#">Répondre par email</a>
          <button type="button" class="btn btn-accent" data-action="marquer-lu">Marquer comme traité</button>
        </div>
      </div>
    </td>
  </tr>
</template>

<script type="module" src="/js/include.js"></script>
<script type="module" src="/js/auth.js"></script>
<script type="module" src="/js/pages/admin/messages.js"></script>
</body>
</html>
