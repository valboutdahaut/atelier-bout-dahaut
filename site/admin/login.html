<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion admin — L'Atelier du Bout d'à Haut</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/layout.css">
</head>
<body data-admin-login="true" style="background:var(--color-text)">

<div class="login-screen">
  <div class="login-card">
    <img src="/assets/logo-atelier-clair.png" alt="" style="width:56px;height:56px;object-fit:contain;margin:0 auto">
    <h1 style="color:var(--color-bg);font-size:26px">Administration</h1>
    <p style="color:rgba(244,237,222,.7)">L'Atelier du Bout d'à Haut</p>

    <form id="login-form" style="display:flex;flex-direction:column;gap:12px;text-align:left;margin-top:8px">
      <label for="login-email" style="color:rgba(244,237,222,.7);font-size:13px">Votre adresse email</label>
      <input type="email" id="login-email" name="email" required autocomplete="email"
             placeholder="adresse@exemple.fr"
             style="border:1px solid rgba(244,237,222,.3);padding:14px 16px;font-size:15px;background:rgba(244,237,222,.06);color:var(--color-bg)">
      <button type="submit" class="btn btn-accent" id="login-btn">Recevoir le lien de connexion</button>
    </form>

    <div id="login-message" class="status-msg" hidden></div>

    <p style="color:rgba(244,237,222,.45);font-size:12.5px;line-height:1.6;margin-top:8px">
      Pas de mot de passe à retenir : vous recevez un lien par email, valable quelques minutes,
      qui vous connecte en un clic.
    </p>
  </div>
</div>

<script type="module" src="/js/auth.js"></script>
</body>
</html>
