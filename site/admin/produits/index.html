<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produits boutique — Administration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body data-admin-guard="true">

<div class="admin-layout">
  <div data-include="sidebar-admin"></div>

  <main class="admin-main">
    <div class="section-heading">
      <h1 style="font-size:30px">Produits boutique</h1>
      <a class="btn btn-primary" href="/admin/produits/nouveau.html">Nouveau produit</a>
    </div>

    <div class="admin-filtres">
      <div class="filtre">
        <label for="f-recherche">Rechercher</label>
        <input id="f-recherche" type="search" placeholder="Titre du produit…">
      </div>
      <div class="filtre">
        <label for="f-categorie">Catégorie</label>
        <select id="f-categorie"><option value="">Toutes</option></select>
      </div>
      <div class="filtre">
        <label for="f-statut">Statut</label>
        <select id="f-statut">
          <option value="">Tous</option>
          <option value="publie">En ligne</option>
          <option value="brouillon">Brouillon</option>
        </select>
      </div>
      <div class="filtre filtre-prix">
        <label for="f-prix-min">Prix (€)</label>
        <div class="paire-champs">
          <input id="f-prix-min" type="number" min="0" step="1" placeholder="de" aria-label="Prix minimum">
          <span>à</span>
          <input id="f-prix-max" type="number" min="0" step="1" placeholder="à" aria-label="Prix maximum">
        </div>
      </div>
      <div class="filtre">
        <label for="f-tri">Trier par</label>
        <select id="f-tri">
          <option value="recent">Ajout le plus récent</option>
          <option value="ancien">Ajout le plus ancien</option>
          <option value="titre-az">Titre A → Z</option>
          <option value="titre-za">Titre Z → A</option>
          <option value="prix-asc">Prix croissant</option>
          <option value="prix-desc">Prix décroissant</option>
          <option value="stock-asc">Stock croissant</option>
          <option value="stock-desc">Stock décroissant</option>
        </select>
      </div>
      <button type="button" class="btn btn-outline btn-reinit" id="f-reset">Réinitialiser</button>
    </div>

    <p class="compteur-resultats" id="compteur-produits">Chargement…</p>

    <table class="admin-table">
      <thead><tr><th></th><th>Titre</th><th>Catégorie</th><th>Prix</th><th>Stock</th><th>Statut</th><th></th></tr></thead>
      <tbody id="table-produits">
        <tr><td colspan="7" class="empty-state">Chargement…</td></tr>
      </tbody>
    </table>
  </main>
</div>

<script type="module" src="/js/include.js"></script>
<script type="module" src="/js/auth.js"></script>
<script type="module" src="/js/pages/admin/produits-liste.js"></script>
</body>
</html>
