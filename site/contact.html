<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — L'Atelier du Bout d'à Haut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/layout.css">
</head>
<body data-nav-section="contact">

<div data-include="header-public"></div>

<main class="container" style="max-width:640px;padding:64px 0 96px">
  <h1 style="font-size:36px;margin-bottom:12px">Me contacter</h1>
  <p style="color:var(--color-text-muted);margin-bottom:32px">Un projet de restauration, une question sur une pièce de la boutique, ou une envie de sur-mesure&nbsp;: écrivez-moi, je réponds sous 48h.</p>

  <form id="form-contact">
    <div class="form-row form-row-2">
      <div class="field"><label for="nom">Nom</label><input id="nom" name="nom" required></div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
    </div>
    <div class="field"><label for="telephone">Téléphone <span class="hint">— facultatif</span></label><input id="telephone" name="telephone" type="tel"></div>
    <div class="field"><label for="sujet">Sujet</label><input id="sujet" name="sujet"></div>
    <div class="field"><label for="message">Message</label><textarea id="message" name="message" required></textarea></div>

    <div id="statut-contact" class="status-msg" hidden></div>

    <button type="submit" class="btn btn-accent" id="btn-envoyer">Envoyer</button>
  </form>

  <div style="margin-top:56px;padding-top:40px;border-top:1px solid var(--color-border);display:flex;flex-direction:column;gap:40px">
    <div>
      <h2 style="font-size:18px;margin-bottom:10px">Nous trouver</h2>
      <div id="contact-adresses" style="font-size:14.5px;line-height:1.8;color:var(--color-text-muted)"></div>

      <!-- Carte du showroom, sous les adresses.
           OpenStreetMap plutôt que Google Maps : pas de clé à gérer, et
           surtout aucun cookie déposé chez un tiers, ce qui éviterait sinon
           d'avoir à demander un consentement au visiteur.
           Pour changer d'adresse : remplacer les coordonnées dans bbox et
           marker ci-dessous, ainsi que dans le lien d'itinéraire. -->
      <figure class="carte-lieu">
        <iframe
          title="Carte du showroom, 109 rue du Général de Gaulle à Rambouillet"
          src="https://www.openstreetmap.org/export/embed.html?bbox=1.8183%2C48.6412%2C1.8303%2C48.6462&amp;layer=mapnik&amp;marker=48.6437%2C1.8243"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"></iframe>
        <figcaption>
          <span>Showroom &middot; 109 rue du Général de Gaulle, Passage Fleuri, 78120 Rambouillet</span>
          <a href="https://www.openstreetmap.org/directions?to=48.6437%2C1.8243" target="_blank" rel="noopener noreferrer">Itinéraire ↗</a>
        </figcaption>
      </figure>
    </div>

    <!-- Masqué tant qu'aucun réseau n'est renseigné dans l'administration. -->
    <div data-section="reseaux" hidden>
      <h2 style="font-size:18px;margin-bottom:14px">Suivre l'atelier</h2>
      <div id="reseaux-liste" class="reseaux-liste"></div>
    </div>
  </div>
</main>

<div data-include="footer"></div>

<script type="module" src="/js/include.js"></script>
<script type="module" src="/js/nav.js"></script>
<script type="module" src="/js/pages/contact.js"></script>
</body>
</html>
