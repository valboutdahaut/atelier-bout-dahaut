<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CGU et CGV — L'Atelier du Bout d'à Haut</title>
<meta name="description" content="Conditions générales d'utilisation et de vente de L'Atelier du Bout d'à Haut.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">

<body>

<div data-include="header-public"></div>

<nav class="container" style="padding:16px 0;font-size:13px;color:var(--color-text-muted)">
  <a href="/index.html">Accueil</a> / <span style="color:var(--color-text)">CGU et CGV</span>
</nav>

<main class="container legal" style="padding-bottom:96px">

  <header class="legal-entete">
    <span class="eyebrow">Informations légales</span>
    <h1 id="cgu-cgv-titre">Conditions générales d'utilisation et de vente</h1>
  </header>

  <!-- Toutes les rubriques sont vides au départ : des conditions de vente
       engagent l'atelier envers ses clients, elles doivent être rédigées par
       l'artisane. Chacune apparaîtra dès qu'elle sera remplie dans l'admin. -->
  <div class="legal-contenu">

    <p class="legal-vide" data-slot="page-vide">Ces conditions sont en cours de rédaction.</p>

    <section class="legal-section" data-cle="cgv-objet" hidden>
      <h2>Objet</h2>
      <div data-slot="texte"></div>
    </section>

    <section class="legal-section" data-cle="cgv-commandes" hidden>
      <h2>Commandes</h2>
      <div data-slot="texte"></div>
    </section>

    <section class="legal-section" data-cle="cgv-prix" hidden>
      <h2>Prix et paiement</h2>
      <div data-slot="texte"></div>
    </section>

    <section class="legal-section" data-cle="cgv-livraison" hidden>
      <h2>Livraison et retrait</h2>
      <div data-slot="texte"></div>
    </section>

    <section class="legal-section" data-cle="cgv-retractation" hidden>
      <h2>Droit de rétractation</h2>
      <div data-slot="texte"></div>
    </section>

    <section class="legal-section" data-cle="cgv-garanties" hidden>
      <h2>Garanties</h2>
      <div data-slot="texte"></div>
    </section>

    <section class="legal-section" data-cle="cgv-litiges" hidden>
      <h2>Litiges</h2>
      <div data-slot="texte"></div>
    </section>

  </div>

</main>

<div data-include="footer"></div>

<script type="module" src="/js/include.js"></script>
<script type="module" src="/js/nav.js"></script>
<script type="module" src="/js/pages/legal.js"></script>
</body>
</html>
